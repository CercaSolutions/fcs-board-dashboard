<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FCS Board Dashboard Prototype</title>
<link rel="icon" href="assets/brand/fcs-mark-color.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/brand/fcs-brand.css?v=20261120">
<style>
/* Layout idea: navy brand header with the wave edge and a four-pillar color band, tab bar, then card grids that wrap to one column on a phone.
   Brand: FCS Brand Identity Guidelines, 2022 guide updated October 2025. Navy carries the page, grays stay neutral,
   and teal, green, orange and lime appear as the four pillar colors. */
:root{
  color-scheme: light;
  --navy:var(--fcs-navy); --teal:var(--fcs-teal); --green:var(--fcs-green); --orange:var(--fcs-orange); --lime:var(--fcs-lime);
  --mist:var(--fcs-light-gray); --gray:var(--fcs-charcoal); --ink:#1B2433; --ground:var(--fcs-ground); --card:#FFFFFF;
  --line:#E4E7EA;
  --warn-bg:var(--fcs-orange-tint); --warn-ink:#7A2A0C; --ok-bg:var(--fcs-teal-tint); --ok-ink:var(--fcs-navy);
  --font:var(--font-body);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45}
header{background:var(--navy);color:#fff}
.head-in{max-width:1180px;margin:0 auto;padding:22px 24px 14px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.head-in img{height:60px;width:auto;display:block}
.head-in .logo-print{display:none}
.head-title{display:flex;flex-direction:column;gap:4px;text-align:right}
.head-title h1{margin:0;font-family:var(--font-head);font-weight:700;font-size:28px;letter-spacing:.04em;text-transform:uppercase;line-height:1.1;text-wrap:balance}
.head-title span{font-size:14px;opacity:.92}
.pillars{display:flex;height:6px}
.pillars i{flex:1}
.wave{display:block;width:100%;height:22px}
main{max-width:1180px;margin:0 auto;padding:8px 24px 48px;display:flex;flex-direction:column;gap:22px}
.sample{background:var(--warn-bg);color:var(--warn-ink);border-left:4px solid var(--orange);border-radius:8px;padding:10px 14px;font-size:14px}
nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
nav button, nav a{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--navy);background:#fff;color:var(--navy);font:inherit;font-size:15px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;text-decoration:none}
nav button:hover, nav a:hover{background:var(--fcs-teal-tint)}
nav button[aria-current="page"]{background:var(--navy);color:#fff;box-shadow:inset 0 -4px 0 var(--lime)}
nav .print-tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
nav .print-tools{gap:6px}
nav .print-tools button{border-color:var(--teal);color:var(--navy);font-size:14px;padding:0 14px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.grid{display:flex;flex-wrap:wrap;gap:16px}
.card{background:var(--card);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:8px;flex:1 1 230px;min-width:0;border-top:4px solid transparent}
.card.wide{flex:2 1 520px}
.card.navy{background:var(--navy);color:#fff;position:relative;overflow:hidden;border-top-color:var(--lime)}
.card.navy > *{position:relative}
.card.navy .watermark{position:absolute;right:-28px;bottom:-34px;width:150px;height:auto;opacity:.12;filter:brightness(0) invert(1);pointer-events:none}
.card.navy h2{color:#fff}
button.card{border:0;border-top:4px solid transparent;text-align:left;font:inherit;color:inherit;cursor:pointer}
button.card:hover{box-shadow:0 0 0 2px var(--teal)}
.acc-navy{border-top-color:var(--navy)!important}.acc-teal{border-top-color:var(--teal)!important}.acc-green{border-top-color:var(--green)!important}
.acc-orange{border-top-color:var(--orange)!important}.acc-lime{border-top-color:var(--lime)!important}.acc-gray{border-top-color:var(--gray)!important}
h2{margin:0;font-family:var(--font-head);font-weight:700;font-size:17px;letter-spacing:.05em;text-transform:uppercase;line-height:1.2;color:var(--navy);text-wrap:balance}
.label{font-size:14px;color:var(--gray)}
.big{font-family:var(--font-accent);font-weight:700;font-size:32px;line-height:1.15;color:var(--navy);font-variant-numeric:lining-nums;word-spacing:-.08em}
.small{font-size:13px;color:var(--gray)}
.bar{height:10px;background:var(--mist);border-radius:5px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--teal);border-radius:5px}
.bar.navyfill > i{background:var(--navy)}
.row{display:flex;justify-content:space-between;gap:12px;font-size:15px;border-bottom:1px solid var(--line);padding-bottom:7px}
.row:last-child{border-bottom:0}
.row b{font-weight:700;color:var(--navy);text-align:right;font-variant-numeric:tabular-nums}
.pill{font-size:13px;font-weight:600;padding:3px 10px;border-radius:12px;white-space:nowrap;align-self:flex-start}
.pill.ok{background:var(--ok-bg);color:var(--ok-ink);box-shadow:inset 3px 0 0 var(--teal)}
.pill.watch{background:var(--warn-bg);color:var(--warn-ink);box-shadow:inset 3px 0 0 var(--orange)}
.pill.behind{background:var(--gray);color:#fff}
.pill.stale{background:var(--warn-bg);color:var(--warn-ink)}
.stripe{height:6px;border-radius:3px;width:56px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--gray)}
.legend i{display:inline-block;width:18px;height:4px;vertical-align:middle;margin-right:6px}
svg{max-width:100%}
a{color:var(--navy);font-weight:600}
.card.navy a{color:#fff}
.tablewrap{overflow-x:auto;background:#fff;border-radius:12px;padding:8px}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
th{background:var(--navy);color:#fff;text-align:left;padding:10px;font-weight:700}
td{padding:8px 10px;border-bottom:1px solid var(--line)}
tr.auto td{background:var(--fcs-teal-tint)}
td input{font:inherit;font-size:14px;padding:8px;border:1px solid #9AA3AB;border-radius:6px;width:100%;min-width:110px;background:#fff;color:var(--ink)}
.note{font-size:14px;color:var(--gray);max-width:70ch}
.print-only{display:none}
.print-section-title{font-family:var(--font-head);font-weight:700;font-size:20px;letter-spacing:.05em;text-transform:uppercase;color:var(--navy);margin:0 0 12px;padding-bottom:6px;border-bottom:3px solid var(--teal)}
@media (max-width:560px){.head-title{text-align:left}.head-in img{height:50px}nav .print-tools{margin-left:0}}

/* Print: letter landscape, colors kept. Print all pages puts each tab on its own page and leaves out the editing screen. */
@page{size:letter landscape;margin:0.4in}
@media print{
  html,body{background:#fff}
  body{font-size:12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  header{background:#fff;color:var(--navy);border-bottom:3px solid var(--navy)}
  .head-in{padding:0 0 8px;max-width:none}
  .head-in .logo-screen{display:none}
  .head-in .logo-print{display:block;height:46px}
  .head-title h1{font-size:22px;color:var(--navy)}
  .head-title span{color:var(--gray);opacity:1}
  .wave{display:none}
  .pillars{height:4px;margin-top:0}
  main{max-width:none;padding:10px 0 0;gap:12px}
  nav{display:none}
  .sample{font-size:11px;padding:6px 10px}
  .card{break-inside:avoid;border:1px solid var(--line);border-top-width:4px;padding:10px 12px;gap:4px}
  .print-section-title{font-size:16px;margin-bottom:8px}
  .bar{height:7px}
  .card.navy{border-color:var(--navy);border-top-color:var(--lime)}
  button.card{border:1px solid var(--line);border-top-width:4px}
  .big{font-size:24px}
  .grid{gap:10px}
  .grid > button.card{flex-basis:130px!important}
  .grid > div.card{flex-basis:220px!important}
  .grid > .card.wide{flex:2 1 420px!important}
  .grid > div:not(.card){flex-basis:260px!important;gap:10px!important}
  .grid > div:not(.card) > .card{flex:0 0 auto!important}
  .card.wide svg{max-height:2in}
  .card svg[aria-label^="Cash on hand"]{width:130px}
  .big{font-size:22px}
  .grid[style]{margin-top:10px!important}
  .note{font-size:11px;margin:6px 0 0!important}
  a{text-decoration:none}
  .card a[href]{display:none}
  .print-only{display:block}
  .print-section{break-before:page}
  .print-section:first-child{break-before:auto}
  .no-print{display:none!important}
}
</style>
</head>
<body>
<header>
  <div class="head-in">
    <img class="logo-screen" src="assets/brand/fcs-logo-horizontal-reverse.svg" alt="Focused Community Strategies">
    <img class="logo-print" src="assets/brand/fcs-logo-horizontal-color.svg" alt="Focused Community Strategies">
    <div class="head-title">
      <h1>Board Dashboard</h1>
      <span id="meetingLine"></span>
    </div>
  </div>
  <div class="pillars" aria-hidden="true"><i style="background:var(--teal)"></i><i style="background:var(--green)"></i><i style="background:var(--orange)"></i><i style="background:var(--lime)"></i></div>
  <svg class="wave" viewBox="0 0 1200 22" preserveAspectRatio="none" aria-hidden="true"><path d="M0 0 H1200 V8 C900 20 620 2 300 14 C180 18 80 14 0 12 Z" fill="#0D2746"></path><path d="M0 12 C80 14 180 18 300 14 C620 2 900 20 1200 8 V22 H0 Z" fill="#F3F4F5"></path></svg>
</header>
<main>
  <div class="sample">Working prototype with sample numbers. Dollar figures and percentages are made up. Counts marked * come from the board chair's slide and are not yet confirmed.</div>
  <nav aria-label="Dashboard sections">
    <button type="button" data-view="overview">Overview</button>
    <button type="button" data-view="money">Money</button>
    <button type="button" data-view="neighborhoods">Neighborhoods</button>
    <button type="button" data-view="priorities">Priorities and governance</button>
    <button type="button" data-view="sheet">Edit the numbers</button>
    <a href="https://cercasolutions.github.io/fcs-logic-model/">Logic model</a>
    <span class="print-tools" id="printTools" hidden><button type="button" id="printThis">Print this page</button><button type="button" id="printAll">Print all pages</button></span>
  </nav>
  <div id="view"></div>
</main>
<script>
var LOGIC = 'https://cercasolutions.github.io/fcs-logic-model/';
var SETTINGS = { meeting: 'December 2026 board meeting', lastMeeting: '2026-09-15' };
// Rows mirror the planned Board Notes tab: one row per item. src "master" = reads from the Master list for Measures; "typed" = the President types it.
var ROWS = [
 {id:'budget_month', tab:'Money', label:'Budget per month, revenue', value:118000, unit:'usd', asOf:'2026-11-15', src:'master'},
 {id:'budget_month_exp', tab:'Money', label:'Budget per month, expenses', value:114000, unit:'usd', asOf:'2026-11-15', src:'master'},
 {id:'cash_months', tab:'Money', label:'Cash on hand, months of expenses', value:1.5, unit:'months', asOf:'2026-11-15', src:'master'},
 {id:'reserve_months', tab:'Money', label:'Operating reserves, months of expenses', value:0.5, unit:'months', asOf:'2026-11-15', src:'master'},
 {id:'reserve_target', tab:'Money', label:'Reserve target, months', value:null, unit:'months', asOf:'', src:'master'},
 {id:'fund_goal', tab:'Money', label:'Annual fundraising goal', value:750000, unit:'usd', asOf:'2026-11-15', src:'master'},
 {id:'fund_raised', tab:'Money', label:'Raised to date', value:525000, unit:'usd', asOf:'2026-11-15', src:'master'},
 {id:'top3', tab:'Money', label:'Revenue from top three sources', value:62, unit:'pct', asOf:'2026-11-15', src:'master'},
 {id:'src_found', tab:'Money', group:'sources', label:'Foundations', value:45, unit:'pct', asOf:'2026-11-15', src:'master'},
 {id:'src_corp', tab:'Money', group:'sources', label:'Corporations', value:20, unit:'pct', asOf:'2026-11-15', src:'master'},
 {id:'src_ind', tab:'Money', group:'sources', label:'Individuals', value:25, unit:'pct', asOf:'2026-11-15', src:'master'},
 {id:'src_church', tab:'Money', group:'sources', label:'Churches', value:10, unit:'pct', asOf:'2026-11-15', src:'master'},
 {id:'sp_housing', tab:'Money', group:'pillars', label:'Housing', value:38, unit:'pct', asOf:'2026-09-30', src:'master'},
 {id:'sp_econ', tab:'Money', group:'pillars', label:'Economic Vitality', value:27, unit:'pct', asOf:'2026-09-30', src:'master'},
 {id:'sp_edu', tab:'Money', group:'pillars', label:'Education', value:12, unit:'pct', asOf:'2026-09-30', src:'master'},
 {id:'sp_health', tab:'Money', group:'pillars', label:'Health and Wellness', value:8, unit:'pct', asOf:'2026-09-30', src:'master'},
 {id:'sp_back', tab:'Money', group:'pillars', label:'Back office', value:15, unit:'pct', asOf:'2026-09-30', src:'master'},

 {id:'n_plots_hsa', tab:'Neighborhoods', group:'Footprint', label:'Historic South Atlanta, land plots *', value:655, unit:'count', asOf:'2026-11-17', src:'typed'},
 {id:'n_plots_th', tab:'Neighborhoods', group:'Footprint', label:'Thomasville Heights, land plots', value:null, unit:'count', asOf:'', src:'typed'},
 {id:'n_rentals', tab:'Neighborhoods', group:'Housing', label:'Rental homes FCS manages *', value:32, unit:'count', asOf:'2026-11-17', src:'typed'},
 {id:'n_constr', tab:'Neighborhoods', group:'Housing', label:'Workforce homes in construction *', value:3, unit:'count', asOf:'2026-11-17', src:'typed'},
 {id:'n_forsale', tab:'Neighborhoods', group:'Housing', label:'Workforce homes for sale *', value:2, unit:'count', asOf:'2026-11-17', src:'typed'},
 {id:'n_bp', tab:'Neighborhoods', group:'Housing', label:'Brownsville Pointe, phase 1 *', value:'12 condos, expected June 2027', unit:'text', asOf:'2026-11-17', src:'typed'},
 {id:'n_coop', tab:'Neighborhoods', group:'Health and Wellness', label:'Food co-op families *', value:11, unit:'count', asOf:'2026-06-10', src:'typed'},
 {id:'n_church', tab:'Neighborhoods', group:'Health and Wellness', label:'Churches in the community development cohort *', value:6, unit:'count', asOf:'2026-11-17', src:'typed'},
 {id:'n_cust', tab:'Neighborhoods', group:'Economic Development', label:'Carver Market and Community Grounds, monthly customers *', value:237, unit:'count', asOf:'2026-11-17', src:'typed'},
 {id:'n_startme', tab:'Neighborhoods', group:'Economic Development', label:'StartMe cohort, March to June 2027 *', value:7, unit:'count', asOf:'2026-11-17', src:'typed'},
 {id:'n_hs', tab:'Neighborhoods', group:'Education', label:'Head Start seats', value:null, unit:'count', asOf:'', src:'typed'},
 {id:'n_slater', tab:'Neighborhoods', group:'Education', label:'Slater Elementary enrollment *', value:410, unit:'count', asOf:'2026-11-17', src:'typed'},
 {id:'n_price', tab:'Neighborhoods', group:'Education', label:'Price Middle School enrollment *', value:197, unit:'count', asOf:'2026-11-17', src:'typed'},

 {id:'p1', tab:'Priorities', group:'priorities', label:'[2027 priority 1]', value:'On track', unit:'status', asOf:'2026-11-17', src:'typed'},
 {id:'p2', tab:'Priorities', group:'priorities', label:'[2027 priority 2]', value:'On track', unit:'status', asOf:'2026-11-17', src:'typed'},
 {id:'p3', tab:'Priorities', group:'priorities', label:'[2027 priority 3]', value:'Watch', unit:'status', asOf:'2026-11-17', src:'typed'},
 {id:'c_open', tab:'Priorities', group:'capacity', label:'Open positions', value:2, unit:'count', asOf:'2026-11-15', src:'master'},
 {id:'c_turn', tab:'Priorities', group:'capacity', label:'Staff turnover, year to date', value:9, unit:'pct', asOf:'2026-11-15', src:'master'},
 {id:'c_vol', tab:'Priorities', group:'capacity', label:'Volunteers', value:150, unit:'count', asOf:'2026-11-15', src:'master'},
 {id:'g_att', tab:'Priorities', group:'governance', label:'Board attendance, year to date', value:92, unit:'pct', asOf:'2026-11-15', src:'master'},
 {id:'g_give', tab:'Priorities', group:'governance', label:'Board giving participation', value:100, unit:'pct', asOf:'2026-11-15', src:'master'},
 {id:'g_vac', tab:'Priorities', group:'governance', label:'Vacant board seats', value:1, unit:'count', asOf:'2026-11-15', src:'master'},

 {id:'a1', tab:'Board asks', group:'asks', label:'Ask 1', value:'Two board members to join donor and foundation calls *', unit:'text', asOf:'2026-11-17', src:'typed'},
 {id:'a2', tab:'Board asks', group:'asks', label:'Ask 2', value:'Young Professionals Board fundraiser, April 2027 *', unit:'text', asOf:'2026-11-17', src:'typed'},
 {id:'a3', tab:'Board asks', group:'asks', label:'Ask 3', value:'', unit:'text', asOf:'', src:'typed'}
];
var MONTHS = [
 {m:'Jan',rev:95000,exp:98000},{m:'Feb',rev:100000,exp:96000},{m:'Mar',rev:110000,exp:102000},{m:'Apr',rev:105000,exp:100000},
 {m:'May',rev:120000,exp:104000},{m:'Jun',rev:98000,exp:99000},{m:'Jul',rev:112000,exp:101000},{m:'Aug',rev:108000,exp:103000},
 {m:'Sep',rev:125000,exp:100000},{m:'Oct',rev:115000,exp:98000},{m:'Nov',rev:112000,exp:99000}
];
var PILLAR = {'Footprint':'var(--navy)','Housing':'var(--teal)','Economic Development':'var(--green)','Health and Wellness':'var(--orange)','Education':'var(--lime)'};
var VIEWS = ['overview','money','neighborhoods','priorities','sheet'];

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function row(id){for(var i=0;i<ROWS.length;i++){if(ROWS[i].id===id)return ROWS[i];}return {value:null};}
function num(id){var v=row(id).value;return (typeof v==='number'&&isFinite(v))?v:null;}
function group(g){return ROWS.filter(function(r){return r.group===g;});}
function money(n){if(n==null)return 'Not entered';var a=Math.abs(n),s=n<0?'-':'';if(a>=1e6)return s+'$'+(a/1e6).toFixed(a%1e6===0?0:1)+'M';if(a>=1e3)return s+'$'+Math.round(a/1e3)+'K';return s+'$'+Math.round(a);}
function show(r){var v=r.value;if(v==null||v==='')return 'Not entered yet';if(r.unit==='usd')return money(v);if(r.unit==='pct')return v+'%';if(r.unit==='months')return v+' months';if(r.unit==='count')return Number(v).toLocaleString('en-US');return String(v);}
function asOfText(d){if(!d)return '';var p=d.split('-');var names=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return names[(+p[1]||1)-1]+' '+p[0];}
function stale(r){return !r.asOf || r.asOf < SETTINGS.lastMeeting;}
function sum(k){return MONTHS.reduce(function(t,x){return t+(+x[k]||0);},0);}
function pctOf(a,b){return (b&&a!=null)?Math.round(a/b*100):null;}
function bar(p,cls){p=Math.max(0,Math.min(100,p||0));return '<div class="bar '+(cls||'')+'"><i style="width:'+p+'%"></i></div>';}

function gauge(val,target){
  var max=6,v=Math.max(0,Math.min(max,val||0)),ang=Math.PI*(1-v/max);
  var x=100+80*Math.cos(ang),y=100-80*Math.sin(ang);
  var t='';
  if(target!=null){var ta=Math.PI*(1-Math.min(max,target)/max);t='<line x1="'+(100+66*Math.cos(ta)).toFixed(1)+'" y1="'+(100-66*Math.sin(ta)).toFixed(1)+'" x2="'+(100+94*Math.cos(ta)).toFixed(1)+'" y2="'+(100-94*Math.sin(ta)).toFixed(1)+'" stroke="#0D2746" stroke-width="3"/>';}
  return '<svg viewBox="0 0 200 124" width="200" role="img" aria-label="Cash on hand gauge, '+esc(val)+' months on a scale of 0 to 6">'
   +'<path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="#D6D9DB" stroke-width="16" stroke-linecap="round"/>'
   +(v>0?'<path d="M 20 100 A 80 80 0 0 1 '+x.toFixed(1)+' '+y.toFixed(1)+'" fill="none" stroke="#0199AB" stroke-width="16" stroke-linecap="round"/>':'')
   +t+'<text x="14" y="120" font-size="12" fill="#63666A">0</text><text x="94" y="12" font-size="12" fill="#63666A">3</text><text x="176" y="120" font-size="12" fill="#63666A">6</text></svg>';
}
function lineChart(){
  var W=640,H=250,L=52,R=16,T=14,B=34,bud=num('budget_month')||0;
  var max=Math.max.apply(null,MONTHS.map(function(x){return Math.max(x.rev,x.exp);}).concat([bud]))*1.1||1;
  var step=Math.pow(10,Math.floor(Math.log10(max)));var top=Math.ceil(max/step)*step;if(top/step>6){step*=2;top=Math.ceil(max/step)*step;}
  function X(i){return L+(W-L-R)*i/(MONTHS.length-1);} function Y(v){return T+(H-T-B)*(1-v/top);}
  var g='';for(var v=0;v<=top;v+=step){g+='<line x1="'+L+'" y1="'+Y(v)+'" x2="'+(W-R)+'" y2="'+Y(v)+'" stroke="#E4E7EA"/><text x="'+(L-8)+'" y="'+(Y(v)+4)+'" font-size="12" text-anchor="end" fill="#63666A">'+money(v)+'</text>';}
  var lab=MONTHS.map(function(x,i){return '<text x="'+X(i)+'" y="'+(H-10)+'" font-size="12" text-anchor="middle" fill="#63666A">'+esc(x.m)+'</text>';}).join('');
  function pts(k){return MONTHS.map(function(x,i){return X(i).toFixed(1)+','+Y(+x[k]||0).toFixed(1);}).join(' ');}
  var last=MONTHS.length-1;
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Monthly revenue and expenses against the monthly budget">'+g
   +'<line x1="'+L+'" y1="'+Y(bud)+'" x2="'+(W-R)+'" y2="'+Y(bud)+'" stroke="#63666A" stroke-dasharray="3 5"/>'
   +'<polyline points="'+pts('exp')+'" fill="none" stroke="#F05A22" stroke-width="3" stroke-dasharray="8 6"/>'
   +'<polyline points="'+pts('rev')+'" fill="none" stroke="#0D2746" stroke-width="4"/>'
   +'<circle cx="'+X(last)+'" cy="'+Y(MONTHS[last].rev)+'" r="6" fill="#0D2746"/>'+lab+'</svg>'
   +'<div class="legend"><span><i style="background:#0D2746"></i>Revenue</span><span><i style="background:#F05A22"></i>Expenses (dashed)</span><span><i style="background:#63666A"></i>Monthly budget (dotted)</span></div>';
}
function statusPill(v){var c=(v==='On track')?'ok':(v==='Behind'?'behind':'watch');return '<span class="pill '+c+'">'+esc(v||'Not set')+'</span>';}
function listRows(rs,withDate){return rs.map(function(r){
  var flag=(withDate&&stale(r))?' <span class="pill stale">Needs update</span>':'';
  var d=(withDate&&r.asOf)?'<div class="small">as of '+asOfText(r.asOf)+flag+'</div>':(withDate?'<div class="small">'+flag+'</div>':'');
  return '<div class="row"><span>'+esc(r.label)+d+'</span><b>'+esc(show(r))+'</b></div>';}).join('');}
function asksCard(){var a=group('asks').filter(function(r){return r.value;});
  return '<div class="card navy"><img class="watermark" src="assets/brand/fcs-mark-color.svg" alt=""><h2>Where the board can help</h2>'+(a.length?a.map(function(r){return '<div>'+esc(r.value)+'</div>';}).join(''):'<div>Nothing entered yet.</div>')+'</div>';}

function vOverview(){
  var rev=sum('rev'),bud=(num('budget_month')||0)*MONTHS.length,pr=group('priorities'),on=pr.filter(function(r){return r.value==='On track';}).length;
  var tiles=[
   ['money','Revenue, year to date',money(rev),(pctOf(rev,bud)==null?'':pctOf(rev,bud)+'% of budget to date'),'navy'],
   ['money','Cash on hand',(num('cash_months')==null?'Not entered':num('cash_months')+' mo.'),'months of expenses','navy'],
   ['money','Raised to date',money(num('fund_raised')),(pctOf(num('fund_raised'),num('fund_goal'))||0)+'% of goal','navy'],
   ['neighborhoods','Rental homes FCS manages',show(row('n_rentals')),'Housing','teal'],
   ['priorities','Open positions',show(row('c_open')),'Capacity','gray'],
   ['priorities','Priorities on track',on+' of '+pr.length,'Strategy','gray']];
  return '<div class="grid">'+tiles.map(function(t){return '<button type="button" class="card acc-'+t[4]+'" data-view="'+t[0]+'" style="flex:1 1 170px"><span class="label">'+esc(t[1])+'</span><span class="big">'+esc(t[2])+'</span><span class="small">'+esc(t[3])+'</span></button>';}).join('')+'</div>'
   +'<div class="grid" style="margin-top:16px"><div class="card wide"><h2>Revenue and expenses by month</h2>'+lineChart()+'</div>'
   +'<div style="flex:1 1 300px;display:flex;flex-direction:column;gap:16px">'+asksCard()
   +'<div class="card"><h2>Programs and partners</h2><div>The logic model shows every program, partner and measure by area.</div><a href="'+LOGIC+'">Open the logic model</a></div></div></div>';
}
function vMoney(){
  var rev=sum('rev'),exp=sum('exp'),n=MONTHS.length,rb=(num('budget_month')||0)*n,eb=(num('budget_month_exp')||0)*n,tgt=num('reserve_target');
  var fp=pctOf(num('fund_raised'),num('fund_goal'))||0;
  var SPEND={'Housing':'var(--teal)','Economic Vitality':'var(--green)','Education':'var(--lime)','Health and Wellness':'var(--orange)','Back office':'var(--gray)'};
  function bars(g,cls,colors){return group(g).map(function(r){var b=bar(r.value,cls);if(colors&&colors[r.label])b=b.replace('<i style="','<i style="background:'+colors[r.label]+';');return '<div style="display:flex;flex-direction:column;gap:4px"><div class="row" style="border:0;padding:0"><span>'+esc(r.label)+'</span><b>'+esc(show(r))+'</b></div>'+b+'</div>';}).join('');}
  return '<div class="grid">'
   +'<div class="card"><span class="label">Revenue, year to date</span><span class="big">'+money(rev)+'</span>'+bar(pctOf(rev,rb))+'<span class="small">'+(pctOf(rev,rb)||0)+'% of budget to date</span></div>'
   +'<div class="card"><span class="label">Expenses, year to date</span><span class="big">'+money(exp)+'</span>'+bar(pctOf(exp,eb),'navyfill')+'<span class="small">'+(pctOf(exp,eb)||0)+'% of budget to date</span></div>'
   +'<div class="card"><span class="label">Net surplus, year to date</span><span class="big">'+money(rev-exp)+'</span><div class="row"><span>Operating reserves</span><b>'+esc(show(row('reserve_months')))+'</b></div><span class="small">Reserve target: '+(tgt==null?'not set':tgt+' months')+'</span></div>'
   +'<div class="card" style="align-items:center"><span class="label" style="align-self:flex-start">Cash on hand</span>'+gauge(num('cash_months'),tgt)+'<span class="big">'+esc(show(row('cash_months')))+'</span><span class="small">of expenses</span></div></div>'
   +'<div class="grid" style="margin-top:16px"><div class="card wide"><h2>Revenue and expenses by month</h2>'+lineChart()+'</div>'
   +'<div class="card" style="flex:1 1 300px"><h2>Spending by pillar</h2>'+bars('pillars','',SPEND)+'<span class="small">as of '+asOfText(row('sp_housing').asOf)+'</span></div></div>'
   +'<div class="grid" style="margin-top:16px"><div class="card wide"><h2>Fundraising</h2><div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap"><span class="big">'+money(num('fund_raised'))+'</span><span class="label">of '+money(num('fund_goal'))+' goal</span></div>'+bar(fp,'navyfill')+'<span class="small">'+fp+'% of goal. The top three sources are '+esc(show(row('top3')))+' of revenue.</span></div>'
   +'<div class="card" style="flex:1 1 300px"><h2>Where it comes from</h2>'+bars('sources')+'</div></div>';
}
function vNeighborhoods(){
  var names=['Footprint','Housing','Economic Development','Health and Wellness','Education'];
  return '<div class="grid">'+names.map(function(nm){return '<div class="card" style="flex:1 1 340px;border-top-color:'+PILLAR[nm]+'"><h2>'+esc(nm)+'</h2>'+listRows(group(nm),true)+(nm==='Footprint'?'':'<a href="'+LOGIC+'" class="small">See '+esc(nm)+' on the logic model</a>')+'</div>';}).join('')+asksCard()+'</div>'
   +'<p class="note" style="margin-top:16px">An item shows Needs update when its date is older than the last board meeting or it has no date. Nothing reads as current when it is not.</p>';
}
function vPriorities(){
  var pr=group('priorities').map(function(r){return '<div class="row"><span>'+esc(r.label)+'</span>'+statusPill(r.value)+'</div>';}).join('');
  return '<div class="grid"><div class="card" style="flex:1 1 340px"><h2>Strategic priorities</h2>'+pr+'<span class="small">To be set at the December board meeting</span></div>'
   +'<div class="card" style="flex:1 1 340px"><h2>Organizational capacity</h2>'+listRows(group('capacity'))+'</div>'
   +'<div class="card" style="flex:1 1 340px"><h2>Governance</h2>'+listRows(group('governance'))+'</div></div>';
}
function vSheet(){
  var body=ROWS.map(function(r){
    var val=(r.value==null?'':r.value);
    return '<tr class="'+(r.src==='master'?'auto':'')+'"><td>'+esc(r.tab)+'</td><td><label for="v_'+r.id+'">'+esc(r.label)+'</label></td>'
     +'<td><input id="v_'+r.id+'" data-id="'+r.id+'" data-f="value" value="'+esc(val)+'"></td>'
     +'<td><input id="d_'+r.id+'" data-id="'+r.id+'" data-f="asOf" type="date" value="'+esc(r.asOf)+'" aria-label="As of date for '+esc(r.label)+'"></td>'
     +'<td>'+(r.src==='master'?'Master list for Measures':'Entered in manually')+'</td></tr>';}).join('');
  var mon=MONTHS.map(function(x,i){return '<tr class="auto"><td>'+esc(x.m)+'</td><td><input id="mr_'+i+'" data-m="'+i+'" data-f="rev" value="'+x.rev+'" aria-label="Revenue for '+esc(x.m)+'"></td><td><input id="me_'+i+'" data-m="'+i+'" data-f="exp" value="'+x.exp+'" aria-label="Expenses for '+esc(x.m)+'"></td></tr>';}).join('');
  return '<div class="card" style="gap:6px"><h2>This screen stands in for the Google Sheet</h2><p class="note" style="margin:0">Change any value, then open another tab to see the dashboard redraw. In the real version these are cells in the sheet. Shaded rows would fill in from the Master list for Measures, so only the white rows are typed. Changes here are not saved when you close the page.</p><div id="saved" class="small" role="status" aria-live="polite"></div></div>'
   +'<div class="tablewrap" style="margin-top:16px"><table><thead><tr><th>Tab</th><th>Item</th><th>Value</th><th>As of</th><th>Where it comes from</th></tr></thead><tbody>'+body+'</tbody></table></div>'
   +'<div class="tablewrap" style="margin-top:16px"><table style="min-width:420px"><thead><tr><th>Month</th><th>Revenue</th><th>Expenses</th></tr></thead><tbody>'+mon+'</tbody></table></div>';
}
var RENDER={overview:vOverview,money:vMoney,neighborhoods:vNeighborhoods,priorities:vPriorities,sheet:vSheet};
var TITLES={overview:'Overview',money:'Money',neighborhoods:'Neighborhoods',priorities:'Priorities and governance'};
var current='overview';
function printAll(){
  var html=['overview','money','neighborhoods','priorities'].map(function(v){return '<section class="print-section"><h2 class="print-section-title">'+esc(TITLES[v])+'</h2>'+RENDER[v]()+'</section>';}).join('');
  document.getElementById('view').innerHTML=html;
  var restore=function(){window.removeEventListener('afterprint',restore);go(current);};
  window.addEventListener('afterprint',restore);
  window.print();
}
function go(name){
  if(VIEWS.indexOf(name)<0)name='overview';
  current=name;
  document.getElementById('view').innerHTML=RENDER[name]();
  var bs=document.querySelectorAll('nav button');
  for(var i=0;i<bs.length;i++){if(bs[i].getAttribute('data-view')===name)bs[i].setAttribute('aria-current','page');else bs[i].removeAttribute('aria-current');}
  try{if(location.hash.slice(1)!==name)location.hash=name;}catch(e){}
}
document.addEventListener('click',function(e){var t=e.target.closest('[data-view]');if(t){go(t.getAttribute('data-view'));}});
document.addEventListener('change',function(e){
  var t=e.target;if(!t.matches||!t.matches('input'))return;
  if(t.hasAttribute('data-m')){var n=parseFloat(t.value);MONTHS[+t.getAttribute('data-m')][t.getAttribute('data-f')]=isFinite(n)?n:0;}
  else if(t.hasAttribute('data-id')){var r=row(t.getAttribute('data-id')),f=t.getAttribute('data-f');
    if(f==='asOf'){r.asOf=t.value;}
    else if(r.unit==='text'||r.unit==='status'){r.value=t.value;}
    else{var v=parseFloat(String(t.value).replace(/[$,%\s]/g,''));r.value=isFinite(v)?v:null;}}
  var s=document.getElementById('saved');if(s)s.textContent='Updated. Open any tab to see it.';
});
window.addEventListener('hashchange',function(){go(location.hash.slice(1));});
// Printing works on the hosted site and from a downloaded copy; a private preview frame cannot open the print dialog.
(function(){var t=document.getElementById('printTools');if(!t)return;
  t.hidden=!(/github\.io$/.test(location.hostname)||location.protocol==='file:'||location.hostname==='localhost');
  document.getElementById('printThis').addEventListener('click',function(){window.print();});
  document.getElementById('printAll').addEventListener('click',printAll);})();
document.getElementById('meetingLine').textContent=SETTINGS.meeting+' · sample data';
go(location.hash.slice(1)||'overview');
</script>
</body>
</html>
