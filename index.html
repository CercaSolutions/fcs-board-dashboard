<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FCS Board Dashboard Prototype</title>
<style>
/* Layout idea: navy brand header with the wave edge, tab bar, then card grids that wrap to one column on a phone. */
:root{
  color-scheme: light;
  --navy:#165C7D; --teal:#00A5B5; --green:#80C34D; --orange:#FF7F2F; --lime:#D0DF00;
  --mist:#D9E1E2; --gray:#63666A; --ink:#22313A; --ground:#F4F7F8; --card:#FFFFFF;
  --warn-bg:#FFE9D9; --warn-ink:#7A3606; --ok-bg:#D9F2F4; --ok-ink:#0E3F56;
  --font: "aktiv-grotesk", Arial, Helvetica, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45}
header{background:var(--navy);color:#fff}
.head-in{max-width:1180px;margin:0 auto;padding:22px 24px 10px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.head-in img{height:64px;width:auto;display:block}
.head-title{display:flex;flex-direction:column;gap:2px;text-align:right}
.head-title h1{margin:0;font-size:26px;font-weight:normal;text-wrap:balance}
.head-title span{font-size:14px;opacity:.92}
.wave{display:block;width:100%;height:22px}
main{max-width:1180px;margin:0 auto;padding:8px 24px 48px;display:flex;flex-direction:column;gap:22px}
.sample{background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:10px 14px;font-size:14px}
nav{display:flex;flex-wrap:wrap;gap:8px}
nav button, nav a{min-height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--navy);background:#fff;color:var(--navy);font:inherit;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;text-decoration:none}
nav button[aria-current="page"]{background:var(--navy);color:#fff}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.grid{display:flex;flex-wrap:wrap;gap:16px}
.card{background:var(--card);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:8px;flex:1 1 230px;min-width:0}
.card.wide{flex:2 1 520px}
.card.navy{background:var(--navy);color:#fff}
.card.navy h2{color:#fff}
button.card{border:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
button.card:hover{box-shadow:0 0 0 2px var(--teal)}
h2{margin:0;font-size:19px;font-weight:normal;color:var(--navy);text-wrap:balance}
.label{font-size:14px;color:var(--gray)}
.big{font-size:30px;color:var(--navy);font-variant-numeric:tabular-nums}
.small{font-size:13px;color:var(--gray)}
.bar{height:10px;background:var(--mist);border-radius:5px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--teal);border-radius:5px}
.bar.navyfill > i{background:var(--navy)}
.row{display:flex;justify-content:space-between;gap:12px;font-size:15px;border-bottom:1px solid #E7ECEE;padding-bottom:7px}
.row:last-child{border-bottom:0}
.row b{font-weight:normal;color:var(--navy);text-align:right;font-variant-numeric:tabular-nums}
.pill{font-size:13px;padding:3px 10px;border-radius:12px;white-space:nowrap;align-self:flex-start}
.pill.ok{background:var(--ok-bg);color:var(--ok-ink)}
.pill.watch{background:var(--warn-bg);color:var(--warn-ink)}
.pill.behind{background:var(--gray);color:#fff}
.pill.stale{background:var(--warn-bg);color:var(--warn-ink)}
.stripe{height:6px;border-radius:3px;width:56px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--gray)}
.legend i{display:inline-block;width:18px;height:4px;vertical-align:middle;margin-right:6px}
svg{max-width:100%}
a{color:var(--navy)}
.card.navy a{color:#fff}
.tablewrap{overflow-x:auto;background:#fff;border-radius:12px;padding:8px}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
th{background:var(--navy);color:#fff;text-align:left;padding:10px;font-weight:normal}
td{padding:8px 10px;border-bottom:1px solid #E7ECEE}
tr.auto td{background:#E8F6F7}
td input{font:inherit;font-size:14px;padding:8px;border:1px solid #9FB1B8;border-radius:6px;width:100%;min-width:110px;background:#fff;color:var(--ink)}
.note{font-size:14px;color:var(--gray);max-width:70ch}
@media (max-width:560px){.head-title{text-align:left}.head-in img{height:52px}}
</style>
</head>

var MONTHS = [
 {m:'Jan',rev:95000,exp:98000},{m:'Feb',rev:100000,exp:96000},{m:'Mar',rev:110000,exp:102000},{m:'Apr',rev:105000,exp:100000},
 {m:'May',rev:120000,exp:104000},{m:'Jun',rev:98000,exp:99000},{m:'Jul',rev:112000,exp:101000},{m:'Aug',rev:108000,exp:103000},
 {m:'Sep',rev:125000,exp:100000},{m:'Oct',rev:115000,exp:98000},{m:'Nov',rev:112000,exp:99000}
];
var PILLAR = {'Footprint':'var(--navy)','Housing':'var(--teal)','Economic Development':'var(--green)','Health and Wellness':'var(--orange)','Education':'var(--lime)'};
var VIEWS = ['overview','money','neighborhoods','priorities','sheet'];

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function row(id){for(var i=0;i<ROWS.length;i++){if(ROWS[i].id===id)return ROWS[i];}return {value:null};}
function num(id){var v=row(id).value;return (typeof v==='number'&&isFinite(v))?v:null;}
function group(g){return ROWS.filter(function(r){return r.group===g;});}
function money(n){if(n==null)return 'Not entered';var a=Math.abs(n),s=n<0?'-':'';if(a>=1e6)return s+'$'+(a/1e6).toFixed(a%1e6===0?0:1)+'M';if(a>=1e3)return s+'$'+Math.round(a/1e3)+'K';return s+'$'+Math.round(a);}
function show(r){var v=r.value;if(v==null||v==='')return 'Not entered yet';if(r.unit==='usd')return money(v);if(r.unit==='pct')return v+'%';if(r.unit==='months')return v+' months';if(r.unit==='count')return Number(v).toLocaleString('en-US');return String(v);}
function asOfText(d){if(!d)return '';var p=d.split('-');var names=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return names[(+p[1]||1)-1]+' '+p[0];}
function stale(r){return !r.asOf || r.asOf < SETTINGS.lastMeeting;}
function sum(k){return MONTHS.reduce(function(t,x){return t+(+x[k]||0);},0);}
function pctOf(a,b){return (b&&a!=null)?Math.round(a/b*100):null;}
function bar(p,cls){p=Math.max(0,Math.min(100,p||0));return '<div class="bar '+(cls||'')+'"><i style="width:'+p+'%"></i></div>';}

function gauge(val,target){
  var max=6,v=Math.max(0,Math.min(max,val||0)),ang=Math.PI*(1-v/max);
  var x=100+80*Math.cos(ang),y=100-80*Math.sin(ang);
  var t='';
  if(target!=null){var ta=Math.PI*(1-Math.min(max,target)/max);t='<line x1="'+(100+66*Math.cos(ta)).toFixed(1)+'" y1="'+(100-66*Math.sin(ta)).toFixed(1)+'" x2="'+(100+94*Math.cos(ta)).toFixed(1)+'" y2="'+(100-94*Math.sin(ta)).toFixed(1)+'" stroke="#165C7D" stroke-width="3"/>';}
  return '<svg viewBox="0 0 200 124" width="200" role="img" aria-label="Cash on hand gauge, '+esc(val)+' months on a scale of 0 to 6">'
   +'<path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="#D9E1E2" stroke-width="16" stroke-linecap="round"/>'
   +(v>0?'<path d="M 20 100 A 80 80 0 0 1 '+x.toFixed(1)+' '+y.toFixed(1)+'" fill="none" stroke="#00A5B5" stroke-width="16" stroke-linecap="round"/>':'')
   +t+'<text x="14" y="120" font-size="12" fill="#63666A">0</text><text x="94" y="12" font-size="12" fill="#63666A">3</text><text x="176" y="120" font-size="12" fill="#63666A">6</text></svg>';
}
function lineChart(){
  var W=640,H=250,L=52,R=16,T=14,B=34,bud=num('budget_month')||0;
  var max=Math.max.apply(null,MONTHS.map(function(x){return Math.max(x.rev,x.exp);}).concat([bud]))*1.1||1;
  var step=Math.pow(10,Math.floor(Math.log10(max)));var top=Math.ceil(max/step)*step;if(top/step>6){step*=2;top=Math.ceil(max/step)*step;}
  function X(i){return L+(W-L-R)*i/(MONTHS.length-1);} function Y(v){return T+(H-T-B)*(1-v/top);}
  var g='';for(var v=0;v<=top;v+=step){g+='<line x1="'+L+'" y1="'+Y(v)+'" x2="'+(W-R)+'" y2="'+Y(v)+'" stroke="#E7ECEE"/><text x="'+(L-8)+'" y="'+(Y(v)+4)+'" font-size="12" text-anchor="end" fill="#63666A">'+money(v)+'</text>';}
  var lab=MONTHS.map(function(x,i){return '<text x="'+X(i)+'" y="'+(H-10)+'" font-size="12" text-anchor="middle" fill="#63666A">'+esc(x.m)+'</text>';}).join('');
  function pts(k){return MONTHS.map(function(x,i){return X(i).toFixed(1)+','+Y(+x[k]||0).toFixed(1);}).join(' ');}
  var last=MONTHS.length-1;
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Monthly revenue and expenses against the monthly budget">'+g
   +'<line x1="'+L+'" y1="'+Y(bud)+'" x2="'+(W-R)+'" y2="'+Y(bud)+'" stroke="#63666A" stroke-dasharray="3 5"/>'
   +'<polyline points="'+pts('exp')+'" fill="none" stroke="#FF7F2F" stroke-width="3" stroke-dasharray="8 6"/>'
   +'<polyline points="'+pts('rev')+'" fill="none" stroke="#165C7D" stroke-width="4"/>'
   +'<circle cx="'+X(last)+'" cy="'+Y(MONTHS[last].rev)+'" r="6" fill="#165C7D"/>'+lab+'</svg>'
   +'<div class="legend"><span><i style="background:#165C7D"></i>Revenue</span><span><i style="background:#FF7F2F"></i>Expenses (dashed)</span><span><i style="background:#63666A"></i>Monthly budget (dotted)</span></div>';
}
function statusPill(v){var c=(v==='On track')?'ok':(v==='Behind'?'behind':'watch');return '<span class="pill '+c+'">'+esc(v||'Not set')+'</span>';}
function listRows(rs,withDate){return rs.map(function(r){
  var flag=(withDate&&stale(r))?' <span class="pill stale">Needs update</span>':'';
  var d=(withDate&&r.asOf)?'<div class="small">as of '+asOfText(r.asOf)+flag+'</div>':(withDate?'<div class="small">'+flag+'</div>':'');
  return '<div class="row"><span>'+esc(r.label)+d+'</span><b>'+esc(show(r))+'</b></div>';}).join('');}
function asksCard(){var a=group('asks').filter(function(r){return r.value;});
  return '<div class="card navy"><h2>Where the board can help</h2>'+(a.length?a.map(function(r){return '<div>'+esc(r.value)+'</div>';}).join(''):'<div>Nothing entered yet.</div>')+'</div>';}

function vOverview(){
  var rev=sum('rev'),bud=(num('budget_month')||0)*MONTHS.length,pr=group('priorities'),on=pr.filter(function(r){return r.value==='On track';}).length;
  var tiles=[
   ['money','Revenue, year to date',money(rev),(pctOf(rev,bud)==null?'':pctOf(rev,bud)+'% of budget to date')],
   ['money','Cash on hand',(num('cash_months')==null?'Not entered':num('cash_months')+' mo.'),'months of expenses'],
   ['money','Raised to date',money(num('fund_raised')),(pctOf(num('fund_raised'),num('fund_goal'))||0)+'% of goal'],
   ['neighborhoods','Rental homes FCS manages',show(row('n_rentals')),'Housing'],
   ['priorities','Open positions',show(row('c_open')),'Capacity'],
   ['priorities','Priorities on track',on+' of '+pr.length,'Strategy']];
  return '<div class="grid">'+tiles.map(function(t){return '<button type="button" class="card" data-view="'+t[0]+'" style="flex:1 1 170px"><span class="label">'+esc(t[1])+'</span><span class="big">'+esc(t[2])+'</span><span class="small">'+esc(t[3])+'</span></button>';}).join('')+'</div>'
   +'<div class="grid" style="margin-top:16px"><div class="card wide"><h2>Revenue and expenses by month</h2>'+lineChart()+'</div>'
   +'<div style="flex:1 1 300px;display:flex;flex-direction:column;gap:16px">'+asksCard()
   +'<div class="card"><h2>Programs and partners</h2><div>The logic model shows every program, partner and measure by area.</div><a href="'+LOGIC+'">Open the logic model</a></div></div></div>';
}
function vMoney(){
  var rev=sum('rev'),exp=sum('exp'),n=MONTHS.length,rb=(num('budget_month')||0)*n,eb=(num('budget_month_exp')||0)*n,tgt=num('reserve_target');
  var fp=pctOf(num('fund_raised'),num('fund_goal'))||0;
  function bars(g,cls){return group(g).map(function(r){return '<div style="display:flex;flex-direction:column;gap:4px"><div class="row" style="border:0;padding:0"><span>'+esc(r.label)+'</span><b>'+esc(show(r))+'</b></div>'+bar(r.value,cls)+'</div>';}).join('');}
  return '<div class="grid">'
   +'<div class="card"><span class="label">Revenue, year to date</span><span class="big">'+money(rev)+'</span>'+bar(pctOf(rev,rb))+'<span class="small">'+(pctOf(rev,rb)||0)+'% of budget to date</span></div>'
   +'<div class="card"><span class="label">Expenses, year to date</span><span class="big">'+money(exp)+'</span>'+bar(pctOf(exp,eb),'navyfill')+'<span class="small">'+(pctOf(exp,eb)||0)+'% of budget to date</span></div>'
   +'<div class="card"><span class="label">Net surplus, year to date</span><span class="big">'+money(rev-exp)+'</span><div class="row"><span>Operating reserves</span><b>'+esc(show(row('reserve_months')))+'</b></div><span class="small">Reserve target: '+(tgt==null?'not set':tgt+' months')+'</span></div>'
   +'<div class="card" style="align-items:center"><span class="label" style="align-self:flex-start">Cash on hand</span>'+gauge(num('cash_months'),tgt)+'<span class="big">'+esc(show(row('cash_months')))+'</span><span class="small">of expenses</span></div></div>'
   +'<div class="grid" style="margin-top:16px"><div class="card wide"><h2>Revenue and expenses by month</h2>'+lineChart()+'</div>'
   +'<div class="card" style="flex:1 1 300px"><h2>Spending by pillar</h2>'+bars('pillars','navyfill')+'<span class="small">as of '+asOfText(row('sp_housing').asOf)+'</span></div></div>'
   +'<div class="grid" style="margin-top:16px"><div class="card wide"><h2>Fundraising</h2><div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap"><span class="big">'+money(num('fund_raised'))+'</span><span class="label">of '+money(num('fund_goal'))+' goal</span></div>'+bar(fp,'navyfill')+'<span class="small">'+fp+'% of goal. The top three sources are '+esc(show(row('top3')))+' of revenue.</span></div>'
   +'<div class="card" style="flex:1 1 300px"><h2>Where it comes from</h2>'+bars('sources')+'</div></div>';
}
function vNeighborhoods(){
  var names=['Footprint','Housing','Economic Development','Health and Wellness','Education'];
  return '<div class="grid">'+names.map(function(nm){return '<div class="card" style="flex:1 1 340px"><div class="stripe" style="background:'+PILLAR[nm]+'"></div><h2>'+esc(nm)+'</h2>'+listRows(group(nm),true)+(nm==='Footprint'?'':'<a href="'+LOGIC+'" class="small">See '+esc(nm)+' on the logic model</a>')+'</div>';}).join('')+asksCard()+'</div>'
   +'<p class="note" style="margin-top:16px">An item shows Needs update when its date is older than the last board meeting or it has no date. Nothing reads as current when it is not.</p>';
}
function vPriorities(){
  var pr=group('priorities').map(function(r){return '<div class="row"><span>'+esc(r.label)+'</span>'+statusPill(r.value)+'</div>';}).join('');
  return '<div class="grid"><div class="card" style="flex:1 1 340px"><h2>Strategic priorities</h2>'+pr+'<span class="small">To be set at the December board meeting</span></div>'
   +'<div class="card" style="flex:1 1 340px"><h2>Organizational capacity</h2>'+listRows(group('capacity'))+'</div>'
   +'<div class="card" style="flex:1 1 340px"><h2>Governance</h2>'+listRows(group('governance'))+'</div></div>';
}
function vSheet(){
  var body=ROWS.map(function(r){
    var val=(r.value==null?'':r.value);
    return '<tr class="'+(r.src==='master'?'auto':'')+'"><td>'+esc(r.tab)+'</td><td><label for="v_'+r.id+'">'+esc(r.label)+'</label></td>'
     +'<td><input id="v_'+r.id+'" data-id="'+r.id+'" data-f="value" value="'+esc(val)+'"></td>'
     +'<td><input id="d_'+r.id+'" data-id="'+r.id+'" data-f="asOf" type="date" value="'+esc(r.asOf)+'" aria-label="As of date for '+esc(r.label)+'"></td>'
     +'<td>'+(r.src==='master'?'Master list for Measures':'Entered in manually')+'</td></tr>';}).join('');
  var mon=MONTHS.map(function(x,i){return '<tr class="auto"><td>'+esc(x.m)+'</td><td><input id="mr_'+i+'" data-m="'+i+'" data-f="rev" value="'+x.rev+'" aria-label="Revenue for '+esc(x.m)+'"></td><td><input id="me_'+i+'" data-m="'+i+'" data-f="exp" value="'+x.exp+'" aria-label="Expenses for '+esc(x.m)+'"></td></tr>';}).join('');
  return '<div class="card" style="gap:6px"><h2>This screen stands in for the Google Sheet</h2><p class="note" style="margin:0">Change any value, then open another tab to see the dashboard redraw. In the real version these are cells in the sheet. Shaded rows would fill in from the Master list for Measures, so only the white rows are typed. Changes here are not saved when you close the page.</p><div id="saved" class="small" role="status" aria-live="polite"></div></div>'
   +'<div class="tablewrap" style="margin-top:16px"><table><thead><tr><th>Tab</th><th>Item</th><th>Value</th><th>As of</th><th>Where it comes from</th></tr></thead><tbody>'+body+'</tbody></table></div>'
   +'<div class="tablewrap" style="margin-top:16px"><table style="min-width:420px"><thead><tr><th>Month</th><th>Revenue</th><th>Expenses</th></tr></thead><tbody>'+mon+'</tbody></table></div>';
}
var RENDER={overview:vOverview,money:vMoney,neighborhoods:vNeighborhoods,priorities:vPriorities,sheet:vSheet};
function go(name){
  if(VIEWS.indexOf(name)<0)name='overview';
  document.getElementById('view').innerHTML=RENDER[name]();
  var bs=document.querySelectorAll('nav button');
  for(var i=0;i<bs.length;i++){if(bs[i].getAttribute('data-view')===name)bs[i].setAttribute('aria-current','page');else bs[i].removeAttribute('aria-current');}
  try{if(location.hash.slice(1)!==name)location.hash=name;}catch(e){}
}
document.addEventListener('click',function(e){var t=e.target.closest('[data-view]');if(t){go(t.getAttribute('data-view'));}});
document.addEventListener('change',function(e){
  var t=e.target;if(!t.matches||!t.matches('input'))return;
  if(t.hasAttribute('data-m')){var n=parseFloat(t.value);MONTHS[+t.getAttribute('data-m')][t.getAttribute('data-f')]=isFinite(n)?n:0;}
  else if(t.hasAttribute('data-id')){var r=row(t.getAttribute('data-id')),f=t.getAttribute('data-f');
    if(f==='asOf'){r.asOf=t.value;}
    else if(r.unit==='text'||r.unit==='status'){r.value=t.value;}
    else{var v=parseFloat(String(t.value).replace(/[$,%\s]/g,''));r.value=isFinite(v)?v:null;}}
  var s=document.getElementById('saved');if(s)s.textContent='Updated. Open any tab to see it.';
});
window.addEventListener('hashchange',function(){go(location.hash.slice(1));});
document.getElementById('meetingLine').textContent=SETTINGS.meeting+' · sample data';
go(location.hash.slice(1)||'overview');
</script>
